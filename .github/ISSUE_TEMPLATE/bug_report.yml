name: Bug report
description: Report a reproducible software problem
title: "[Bug] "
labels: ["bug"]
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Git commit/tag
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Python version, hardware. Do not include secrets.
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Sanitized logs
      description: Remove credentials, private IPs/coordinates if necessary.
